{% set versions = {
    "6.8": "226bc3b494675d0fe796119de3555251b7232c6dd4bbb8e7f5a928b157e7fd9d",
    "10.3": "97677cbccb06b2821a5fa1569d1f561b253bd0651a97ab05d13247c708864840",
    "9.1": "d5d04ec4e8ca74a833e21d705f603686e7d92b575a4fae96bb9ef765b7ea9b52"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

package:
  name: {{ environ.get('ANACONDA_PACKAGE', "mcfm")|string|lower }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace('/', '.')|replace('-', '.') }}

{% if version.startswith("9.") %}
build:
  # 9.1 is makefile-based (not CMake like 10.x) and bundles qcdloop 2.0.5
  # with no lib/handyG at all, so it shares neither the build system nor the
  # patches used to enable 10.x on aarch64. Enabling it is separate work.
  skip: true  # [aarch64]
{% elif version.startswith("6.") or "applgrid" in version %}
build:
  # 6.x and every -applgrid variant need applgrid, fastnlo and hoppet (and
  # root 6.38), none of which exist for osx-arm64 on hep-forge or
  # conda-forge. Until those feedstocks build for macOS these variants cannot
  # solve there, so skip instead of producing a guaranteed-red macOS leg.
  # Plain 10.x still builds on macOS.
  skip: true  # [osx]
{% endif %}

# No source: url/git_url block at all -- mcfm.fnal.gov's WAF returns 403
# to conda-build's own downloader (a python-requests-style user agent)
# but allows a bare curl with no explicit -A, verified empirically, with
# stable/deterministic content across repeated fetches. build.sh fetches
# it directly instead, for every version including 6.x.
#  patches: # applied in ./build.sh
#    - patches/handyG.patch                       (10.x/9.x)
#    - patches/applgrid-realint-virtint.patch      (6.x)
#    - patches/applgrid-gridwrap-mxpart.patch      (6.x)
#    - patches/applgrid-mcfm103-hooks.patch       (10.x)
#    - patches/applgrid-mcfm103-hplog.patch       (10.x)
#    - patches/applgrid-mcfm103-cmake.patch       (10.x)
#    - patches/applgrid-bridge-mcfm103.patch      (mcfm-bridge, 10.x-applgrid only)
#
# APPLgrid variant: tag <version>-applgrid (e.g. 10.3-applgrid) to build with
# the bridge enabled. autoupload.yml maps that to PKG_VERSION 10.3.applgrid;
# build.sh strips the suffix to get the upstream MCFM version, builds
# mcfm-bridge, passes -Dwith_applgrid=ON and then FAILS the build unless the
# binary really contains appl::grid symbols. A plain 10.3 tag is unaffected:
# the same patches are applied but with_applgrid stays OFF, and gridwrap.cxx's
# no-op stubs keep the default link intact. See patches/applgrid-mcfm103.md.
#
# For 6.x the bridge is linked UNCONDITIONALLY, so a 6.8-applgrid tag builds
# exactly what a 6.8 tag builds -- the suffix is a naming alias there, not a
# different binary. Both are gated on the same appl::grid symbol check.

requirements:
  build:
    - {{ compiler('gfortran') }}   # GNU Fortran compiler
    - {{ compiler('c') }}          # GNU C compiler
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}        # GNU C++ compiler

    - cmake                        # Build system (10.x)
    - make                         # Make utility
    - automake                     # mcfm-bridge's own build (6.x)
    - autoconf                     # mcfm-bridge's own build (6.x)
    - libtool                      # mcfm-bridge's own build (6.x)
    - perl
    - gnuconfig                    # [osx]  fresh config.sub for qd (see build.sh)
    # macOS: MCFM's C/C++ must be built by clang. GCC 16 on darwin compiles
    # against libc++ with a different std::string layout than the clang-built
    # LHAPDF, so every name MCFM passes arrives garbled -- the package test
    # aborted with "Info file not found for PDF set ''". GCC (from the
    # gfortran/cxx compilers above) stays for Fortran and for qcdloop, which
    # needs __float128. build.sh picks each compiler explicitly.
    - clangxx_osx-arm64            # [osx]
    {% if not version.startswith("6.") %}
    - mpi
    # MCFM 10.x compiles `use mpi` (mod_CPUTime.f90, -Duse_mpi=ON), reading
    # mpich's mpi.mod: a gfortran MODULE file, readable only by a gfortran
    # writing the same module version. conda-forge mpich 5.0.1 build _4
    # (2026-08-19) was compiled with gfortran 15 (module version 16); the
    # Linux compiler is pinned to 14 (module version 15), so every 10.x Linux
    # build died ~40 min in: "Cannot read module file '.../src/Inc/mpi.mod'
    # ... created by a different version of GNU Fortran". _3 is the last build
    # made with gfortran 14.4. build.sh checks the two versions match before
    # compiling. Run stays unpinned: only the compile-time .mod is affected.
    # macOS keeps the newest build (its GCC 16 reads module version 16).
    # Pinned here and not in conda_build_config.yaml -- see the note there.
    - mpich 5.0.1 *_3              # [linux]
    - mpich                        # [osx]
    {% endif %}

  host:
    - lhapdf
    - llvm-openmp                  # [osx]  omp.h for clang's -fopenmp (MCFM's C++)
    {% if version.startswith("6.") or "applgrid" in version %}
    # APPLgrid bridge (mcfm-bridge from applgrid.hepforge.org) links
    # mcfm_interface.cxx/mcfm_grid.cxx into the mcfm binary -- see build.sh.
    # Needed by every 6.x build (the bridge is always linked there) and by
    # any <version>-applgrid tag, e.g. 10.3-applgrid. `version` is the tag
    # with its hyphen intact, so "applgrid" in version catches the variant.
    #
    # The root pin is NOT cosmetic. It selects the whole applgrid -> fastnlo
    # chain, and the root634 builds cannot coexist with hoppet 1.2.0:
    #   fastnlo 2.6.0 root634 requires lhapdf >=6.5.5,<6.5.6
    #   hoppet  1.2.0         requires lhapdf >=6.5.6,<6.5.7
    # so with root634 the host environment is unsolvable (conda:
    # "hoppet =1.2.0 requires lhapdf >=6.5.6,<6.5.7, which conflicts").
    # fastnlo root638 takes lhapdf >=6.5.6,<7 and the set solves on both
    # linux-64 and linux-aarch64.
    - root 6.38.*
    - applgrid * root638
    - hoppet ==1.2.0
    {% endif %}
    {% if not version.startswith("6.") %}
    - mpi
    - mpich 5.0.1 *_3              # [linux]  same pin as build (see above)
    - mpich                        # [osx]
    {% endif %}

  run:
    - lhapdf
    {% if version.startswith("6.") or "applgrid" in version %}
    - root 6.38.*
    - applgrid * root638
    - hoppet ==1.2.0
    {% endif %}
    {% if not version.startswith("6.") %}
    - mpi
    - mpich
    {% endif %}

test:
  commands:
    {% if version.startswith("6.") %}
    # 6.x uses a different run convention (process.DAT in the working
    # dir, not input.ini) and no reference output to validate a real
    # physics run against -- just check the binary is present and
    # linked correctly for now. Grid output itself is opt-in at runtime
    # (input.DAT's `creategrid` flag, .false. by default) so this does
    # not exercise the APPLgrid bridge -- see build.sh/README for that.
    - test -x $PREFIX/bin/mcfm
    {% else %}
    # MCFM 10.x asks OpenMP for 8389760 bytes of thread stack -- just over the
    # 8192 KB default soft limit -- and can abort before doing anything:
    #   OMP: Error #29: Unable to set OMP thread stack size to 8389760 bytes
    # (Reproduced locally. NOT what failed 10.x CI through 4ec884d: those
    # builds never got this far -- see the mpich pin above.) Raise the limit;
    # fall back to the hard limit where a runner caps it (macOS: 65520 KB),
    # so the ulimit call itself cannot fail the test under set -e.
    - ulimit -s unlimited || ulimit -s "$(ulimit -H -s)"
    # ulimit sizes only the MAIN thread's stack. MCFM's OpenMP worker threads
    # get OMP_STACKSIZE (libgomp's default is a few MB) and overflow it in the
    # first integration: "Segmentation fault" right after the startup banner,
    # with an 8 MB or an unlimited ulimit alike. Verified on linux-aarch64
    # (16 threads): segfault without it; OMP_STACKSIZE=256M runs input.ini to
    # completion (11.7524 nb), as does OMP_NUM_THREADS=1.
    - export OMP_STACKSIZE=256M
    - echo "Running \`mcfm\` with $PREFIX/share/mcfm/input.ini (stack $(ulimit -s))"
    - cd $PREFIX/share/mcfm && mcfm
    {% endif %}

about:
  home: "https://mcfm.fnal.gov"
  license: "GPL-3.0"
  summary: "MCFM is a parton-level Monte Carlo program"
  description: |
    MCFM is a parton-level Monte Carlo program that gives predictions for a wide range of processes at hadron colliders.
    Almost all processes are available at NLO, but some processes are also available at NNLO or N3LO in QCD.
extra:
  recipe-maintainers:
    - meiyasan
  # autoupload.yml's Trim step keeps only the newest TRIM_KEEP=2 versions per
  # label plus these. With four release lines, 2 is not enough: publishing
  # 10.3 and 10.3.applgrid on 2026-09-11 deleted 6.8.applgrid. Protect every
  # line explicitly (a future 10.4 must not evict them either).
  lts:
    main: ["6.8", "6.8.applgrid", "10.3", "10.3.applgrid"]
