{% set versions = {
    "6.8": "226bc3b494675d0fe796119de3555251b7232c6dd4bbb8e7f5a928b157e7fd9d",
    "10.3": "97677cbccb06b2821a5fa1569d1f561b253bd0651a97ab05d13247c708864840",
    "9.1": "d5d04ec4e8ca74a833e21d705f603686e7d92b575a4fae96bb9ef765b7ea9b52"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

package:
  name: {{ environ.get('ANACONDA_PACKAGE', "mcfm")|string|lower }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace('/', '.')|replace('-', '.') }}

{% if version.startswith("9.") %}
build:
  # 9.1 is makefile-based (not CMake like 10.x) and bundles qcdloop 2.0.5
  # with no lib/handyG at all, so it shares neither the build system nor the
  # patches used to enable 10.x on aarch64. Enabling it is separate work.
  skip: true  # [aarch64]
{% endif %}

# No source: url/git_url block at all -- mcfm.fnal.gov's WAF returns 403
# to conda-build's own downloader (a python-requests-style user agent)
# but allows a bare curl with no explicit -A, verified empirically, with
# stable/deterministic content across repeated fetches. build.sh fetches
# it directly instead, for every version including 6.x.
#  patches: # applied in ./build.sh
#    - patches/handyG.patch                       (10.x/9.x)
#    - patches/applgrid-realint-virtint.patch      (6.x)
#    - patches/applgrid-gridwrap-mxpart.patch      (6.x)
#    - patches/applgrid-mcfm103-hooks.patch       (10.x)
#    - patches/applgrid-mcfm103-hplog.patch       (10.x)
#    - patches/applgrid-mcfm103-cmake.patch       (10.x)
#    - patches/applgrid-bridge-mcfm103.patch      (mcfm-bridge, 10.x-applgrid only)
#
# APPLgrid variant: tag <version>-applgrid (e.g. 10.3-applgrid) to build with
# the bridge enabled. autoupload.yml maps that to PKG_VERSION 10.3.applgrid;
# build.sh strips the suffix to get the upstream MCFM version, builds
# mcfm-bridge, passes -Dwith_applgrid=ON and then FAILS the build unless the
# binary really contains appl::grid symbols. A plain 10.3 tag is unaffected:
# the same patches are applied but with_applgrid stays OFF, and gridwrap.cxx's
# no-op stubs keep the default link intact. See patches/applgrid-mcfm103.md.
#
# For 6.x the bridge is linked UNCONDITIONALLY, so a 6.8-applgrid tag builds
# exactly what a 6.8 tag builds -- the suffix is a naming alias there, not a
# different binary. Both are gated on the same appl::grid symbol check.

requirements:
  build:
    - {{ compiler('gfortran') }}   # GNU Fortran compiler
    - {{ compiler('c') }}          # GNU C compiler
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}        # GNU C++ compiler

    - cmake                        # Build system (10.x)
    - make                         # Make utility
    - automake                     # mcfm-bridge's own build (6.x)
    - autoconf                     # mcfm-bridge's own build (6.x)
    - libtool                      # mcfm-bridge's own build (6.x)
    - perl
    {% if not version.startswith("6.") %}
    - mpi
    - mpich
    {% endif %}

  host:
    - lhapdf
    {% if version.startswith("6.") %}
    # APPLgrid bridge (mcfm-bridge/mcfm-patch from applgrid.hepforge.org)
    # links mcfm_interface.cxx/mcfm_grid.cxx into the mcfm binary -- see
    # build.sh. root634 pin just picks one applgrid build out of its own
    # root-version matrix; not otherwise significant.
    - root 6.34.*
    - applgrid * root634
    - hoppet ==1.2.0
    {% else %}
    - mpi
    - mpich
    {% endif %}

  run:
    - lhapdf
    {% if version.startswith("6.") %}
    - root 6.34.*
    - applgrid * root634
    - hoppet ==1.2.0
    {% else %}
    - mpi
    - mpich
    {% endif %}

test:
  commands:
    {% if version.startswith("6.") %}
    # 6.x uses a different run convention (process.DAT in the working
    # dir, not input.ini) and no reference output to validate a real
    # physics run against -- just check the binary is present and
    # linked correctly for now. Grid output itself is opt-in at runtime
    # (input.DAT's `creategrid` flag, .false. by default) so this does
    # not exercise the APPLgrid bridge -- see build.sh/README for that.
    - test -x $PREFIX/bin/mcfm
    {% else %}
    - echo "Running \`mcfm\` with $PREFIX/share/mcfm/input.ini"
    - cd $PREFIX/share/mcfm && mcfm
    {% endif %}

about:
  home: "https://mcfm.fnal.gov"
  license: "GPL-3.0"
  summary: "MCFM is a parton-level Monte Carlo program"
  description: |
    MCFM is a parton-level Monte Carlo program that gives predictions for a wide range of processes at hadron colliders.
    Almost all processes are available at NLO, but some processes are also available at NNLO or N3LO in QCD.
extra:
  recipe-maintainers:
    - meiyasan
  lts:
    main: ["6.8"]
